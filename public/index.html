<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Temperature Readings</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            margin: 0;
            padding: 40px;
        }

        h1, #status {
            text-align: center;
        }

        #status {
            color: #666;
        }

        table {
            width: 600px;
            max-width: 100%;
            margin: 30px auto;
            border-collapse: collapse;
            background-color: white;
        }

        th, td {
            border: 1px solid #ccc;
            padding: 12px;
            text-align: center;
        }

        th {
            background-color: #333;
            color: white;
        }

        tr:nth-child(even) {
            background-color: #f9f9f9;
        }
    </style>
</head>
<body>
    <h1>Temperature Readings</h1>
    <p id="status" aria-live="polite">Loading...</p>

    <table>
        <thead>
            <tr>
                <th scope="col">ID</th>
                <th scope="col">Temperature</th>
            </tr>
        </thead>
        <tbody id="temperatureTable"></tbody>
    </table>

    <script>
        async function loadTemperatures() {
            const table = document.getElementById("temperatureTable");
            const status = document.getElementById("status");

            try {
                const response = await fetch("/api/temperature");
                if (!response.ok) {
                    throw new Error("Failed to load temperature data");
                }

                const readings = await response.json();
                table.replaceChildren();

                if (readings.length === 0) {
                    status.textContent = "No temperature readings yet.";
                    return;
                }

                status.textContent = `Showing ${readings.length} temperature reading(s).`;

                readings.forEach((reading) => {
                    const row = document.createElement("tr");
                    const idCell = document.createElement("td");
                    const temperatureCell = document.createElement("td");

                    idCell.textContent = reading.id;
                    temperatureCell.textContent = `${reading.temperature} F`;
                    row.append(idCell, temperatureCell);
                    table.appendChild(row);
                });
            } catch (error) {
                console.error(error);
                status.textContent = "Unable to load temperature data.";
            }
        }

        loadTemperatures();
        setInterval(loadTemperatures, 5000);
    </script>
</body>
</html>
