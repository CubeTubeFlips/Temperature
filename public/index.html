<!DOCTYPE html> <html lang="en"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>Temperature Sensor</title>
<style>
    body {
        font-family: Arial, sans-serif;
        background-color: #f2f2f2;
        margin: 0;
        padding: 40px;
    }

    h1 {
        text-align: center;
    }

    table {
        width: 600px;
        max-width: 100%;
        margin: 30px auto;
        border-collapse: collapse;
        background-color: white;
    }

    th, td {
        border: 1px solid #ccc;
        padding: 12px;
        text-align: center;
    }

    th {
        background-color: #333;
        color: white;
    }

    tr:nth-child(even) {
        background-color: #f9f9f9;
    }

    #status {
        text-align: center;
        color: #666;
    }
</style>

</head> <body>
<h1>Temperature Readings</h1>

<p id="status">Loading...</p>

<table>
    <thead>
        <tr>
            <th>ID</th>
            <th>Temperature</th>
        </tr>
    </thead>

    <tbody id="temperatureTable">
    </tbody>
</table>

<script>
    async function loadTemperatures() {
        const table = document.getElementById("temperatureTable");
        const status = document.getElementById("status");

        try {
            const response = await fetch("/api/temperature");

            if (!response.ok) {
                throw new Error("Failed to load temperature data");
            }

            const data = await response.json();

            table.innerHTML = "";

            if (data.length === 0) {
                status.textContent = "No temperature readings yet.";
                return;
            }

            status.textContent = `Showing ${data.length} temperature reading(s).`;

            data.forEach(reading => {
                const row = document.createElement("tr");

                const idCell = document.createElement("td");
                idCell.textContent = reading.id;

                const temperatureCell = document.createElement("td");
                temperatureCell.textContent = reading.temperature + " °F";

                row.appendChild(idCell);
                row.appendChild(temperatureCell);

                table.appendChild(row);
            });

        } catch (error) {
            console.error(error);
            status.textContent = "Unable to load temperature data.";
        }
    }

    // Load the data when the page opens
    loadTemperatures();

    // Refresh the table every 5 seconds
    setInterval(loadTemperatures, 5000);
</script>

</body> </html>
